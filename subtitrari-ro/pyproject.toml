[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitrari-ro"
version = "0.1.0"
description = "Subtitrări automate în română, pe un singur rând, pentru clipuri video și editoare."
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.1", "customtkinter>=5.2", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
subtitrari-ro = "subtitrari_ro.__main__:main"

[tool.setuptools]
packages = ["subtitrari_ro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
