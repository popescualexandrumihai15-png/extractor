<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Subtitrări RO</title>
  <style>
    :root {
      --fundal: #232323;
      --text: #dddddd;
      --text-secundar: #9a9a9a;
      --principal: #3498db;
      --succes: #27ae60;
      --pericol: #e74c3c;
    }
    body {
      margin: 0;
      padding: 12px;
      background: var(--fundal);
      color: var(--text);
      font: 12px "Segoe UI", -apple-system, sans-serif;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--text-secundar); }
    label { display: block; margin: 6px 0; cursor: pointer; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      border: 0;
      border-radius: 2px;
      background: var(--principal);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #stare { margin-top: 12px; white-space: pre-wrap; color: var(--text-secundar); }
    #stare.ok { color: var(--succes); }
    #stare.eroare { color: var(--pericol); }
  </style>
</head>
<body>
  <h1>🎬 Subtitrări RO</h1>
  <p>Subtitrări în română pentru secvența deschisă, cu stilul ales în aplicație.</p>
  <label><input type="checkbox" id="srt" checked> Track de subtitrări (text editabil)</label>
  <label><input type="checkbox" id="overlay" checked> Strat video cu fontul și stilul din aplicație</label>
  <button id="genereaza">Generează subtitrările</button>
  <div id="stare">Aplicația Subtitrări RO trebuie să fie deschisă.</div>
  <script src="js/main.js"></script>
</body>
</html>
